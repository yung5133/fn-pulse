name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 冒烟测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号检查需要与上一个提交对比，深克隆 2 层即可
          fetch-depth: 2

      - name: 检查版本号是否已更新
        # app/ 下有代码改动却忘了 bump VERSION，会导致镜像 tag 与上一次
        # 无法区分 —— 直接失败提醒。PR 不检查（基线不同易误报）。
        if: github.event_name == 'push'
        run: |
          BEFORE=$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]' || echo "")
          AFTER=$(tr -d '[:space:]' < VERSION)
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- app/ | wc -l)
          echo "VERSION: ${BEFORE:-（无）} -> ${AFTER}；app/ 改动文件数：${CHANGED}"
          if [ -n "${BEFORE}" ] && [ "${CHANGED}" -gt 0 ] && [ "${BEFORE}" = "${AFTER}" ]; then
            echo "::error::app/ 下有代码改动但 VERSION 未更新（仍为 ${AFTER}）。同一功能迭代请用 python tools/bump_version.py patch；新功能用 minor。"
            exit 1
          fi

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 编译检查
        run: python -m compileall -q app run.py tests

      - name: 端到端冒烟测试
        # 使用合成的 trimmedia.db，不涉及任何真实数据
        run: python tests/smoke.py

      - name: 企业微信机器人协议层测试
        # 离线：用 FakeWS 注入传输层驱动完整状态机，不依赖企微可用性
        run: python tests/test_wecom_bot.py

      - name: 快照构建回归测试
        # 离线：覆盖 "database disk image is malformed" 的三条根因
        # （撕裂读自愈 / WAL 回放 / 损坏源明确报错）
        run: python tests/test_snapshot.py
