{% extends "layout.html" %}
{% block title %}媒体库 · FnPulse{% endblock %}

{% block content %}
<div class="page-head">
    <h1 class="page-title">媒体库管理</h1>
    <p class="page-desc">通过飞牛影视 REST 接口下发扫描指令</p>
</div>

<div id="alert"></div>

<div class="grid grid-2">
    <div class="card">
        <div class="card-head">
            <div>
                <h2 class="card-title">媒体库列表</h2>
                <p class="card-sub">来源 /v/api/v1/mdb/list</p>
            </div>
            <button id="btn_reload" class="btn-sm">刷新</button>
        </div>
        <div id="libs"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
        <div class="card-head">
            <div>
                <h2 class="card-title">扫描任务记录</h2>
                <p class="card-sub">仅记录本面板下发过的指令</p>
            </div>
            <button id="btn_tasks" class="btn-sm">刷新</button>
        </div>
        <div id="tasks"><div class="empty">加载中…</div></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function scan(guid, name) {
    try {
        const r = await api('/api/library/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guid: guid, name: name })
        });
        document.getElementById('alert').innerHTML =
            `<div class="alert alert-${r.data.ok ? 'ok' : 'err'}">${r.message}</div>`;
        loadTasks();
    } catch (e) {
        document.getElementById('alert').innerHTML =
            `<div class="alert alert-err">${e.message}</div>`;
    }
}

async function loadLibs() {
    try {
        const r = await api('/api/library/list');
        const box = document.getElementById('libs');
        if (r.available === false) {
            box.innerHTML = `<div class="alert alert-warn" style="margin:0">${r.message}</div>`;
            return;
        }
        const rows = r.data;
        if (!rows.length) { box.innerHTML = '<div class="empty">没有读取到媒体库</div>'; return; }

        box.innerHTML = rows.map(l => `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;
                        padding:10px 0;border-bottom:1px solid #f1f5f9">
                <div style="min-width:0">
                    <div style="font-weight:550">${l.name || '(未命名)'}</div>
                    <div class="faint mono" style="font-size:11px">${l.guid || ''}</div>
                </div>
                <button class="btn-sm" data-guid="${l.guid}" data-name="${(l.name || '').replace(/"/g, '&quot;')}">
                    触发扫描
                </button>
            </div>`).join('');

        // 用事件委托绑定，避免片名中的引号破坏内联 onclick
        box.querySelectorAll('button[data-guid]').forEach(btn => {
            btn.onclick = () => scan(btn.dataset.guid, btn.dataset.name);
        });
    } catch (e) {
        document.getElementById('alert').innerHTML =
            `<div class="alert alert-err">${e.message}</div>`;
    }
}

async function loadTasks() {
    try {
        const r = await api('/api/library/tasks');
        const rows = r.data;
        const box = document.getElementById('tasks');
        if (!rows.length) { box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
        box.innerHTML = rows.map(t => `
            <div class="list-row">
                <div style="display:flex;justify-content:space-between;gap:8px">
                    <b>${t.library_name || t.library_guid}</b>
                    <span class="badge badge-${t.status === 'success' ? 'ok' : 'err'}">
                        ${t.status === 'success' ? '成功' : '失败'}
                    </span>
                </div>
                <div class="faint" style="font-size:12px">${t.message || ''}</div>
                <div class="faint mono" style="font-size:11px">${t.created_at}</div>
            </div>`).join('');
    } catch (e) {}
}

document.getElementById('btn_reload').onclick = loadLibs;
document.getElementById('btn_tasks').onclick = loadTasks;
window.addEventListener('load', () => { loadLibs(); loadTasks(); });
</script>
{% endblock %}
