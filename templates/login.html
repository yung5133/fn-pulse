<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · FnPulse 飞牛映迹</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%E5%BD%B1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
    <div class="card login-card login-shell">
        <div class="card-head">
            <div class="brand-mark">影</div>
            <div style="text-align:center">
                <div style="font-size:17px;font-weight:700">FnPulse · 飞牛映迹</div>
                <div class="faint" style="font-size:12px">飞牛影视数据洞察面板</div>
            </div>
        </div>

        <div id="msg"></div>

        <label class="field">
            <span>账号</span>
            <input type="text" id="username" autocomplete="off" placeholder="本地管理员账号">
        </label>
        <label class="field">
            <span>密码</span>
            <input type="password" id="password" autocomplete="new-password" placeholder="密码">
        </label>

        <label class="field" style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="via_fn" style="width:auto">
            <span style="margin:0">使用飞牛影视账号校验
                <span class="faint">（需在系统设置里填好飞牛地址与账号）</span>
            </span>
        </label>

        <button id="submit" class="btn-primary btn-block">登 录</button>

        <div class="login-meta">默认凭证 admin / fnpulse —— 登录后请立即修改</div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
async function login() {
    const msg = $('msg');
    msg.innerHTML = '';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
                username: $('username').value.trim(),
                password: $('password').value,
                via_fn: $('via_fn').checked
            })
        });
        const body = await res.json();
        if (body.status === 'success') { location.href = '/'; return; }
        msg.innerHTML = `<div class="alert alert-err">${body.message || '登录失败'}</div>`;
    } catch (e) {
        msg.innerHTML = `<div class="alert alert-err">请求失败：${e.message}</div>`;
    }
}
$('submit').onclick = login;
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
