<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>点片箱 · FnPulse 飞牛映迹</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%E5%BD%B1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
    <div class="login-card login-shell" style="width:520px">
        <div class="card" style="margin-bottom:16px">
            <div class="card-head" style="flex-direction:column;align-items:center;gap:6px">
                <div class="brand-mark">影</div>
                <div style="text-align:center">
                    <div style="font-size:17px;font-weight:700">点片箱</div>
                    <div class="faint" style="font-size:12px">想看什么？告诉我们</div>
                </div>
            </div>

            <div id="msg"></div>

            <!-- 登录闸门：auth_mode=fn 时必须先登录飞牛影视账号 -->
            <div id="login_gate" style="display:none">
                <label class="field">
                    <span>飞牛影视账号</span>
                    <input type="text" id="p_username" autocomplete="username"
                           placeholder="你的飞牛影视用户名">
                </label>
                <label class="field">
                    <span>密码</span>
                    <input type="password" id="p_password" autocomplete="current-password">
                </label>
                <button id="btn_login" class="btn-primary btn-block">登 录</button>
                <div class="login-meta">使用你登录飞牛影视的账号，用于确认求片人身份</div>
            </div>

            <!-- 已登录后的表单项 -->
            <div id="main_form" style="display:none">
                <div id="who" class="alert alert-info" style="display:none;font-size:12.5px"></div>

                <label class="field" id="requester_wrap" style="display:none">
                    <span>你的飞牛用户名</span>
                    <input type="text" id="requester" autocomplete="off" placeholder="例如：alice">
                </label>

                <div id="search_box"></div>
                <label class="field" id="manual_title_wrap">
                    <span>想看的片名</span>
                    <input type="text" id="title" autocomplete="off" placeholder="例如：沙丘 2">
                </label>

                <div id="search_results" style="display:none;margin-bottom:14px">
                    <div class="faint" style="font-size:12px;margin-bottom:6px">从 TMDB 选择（点击选中）</div>
                    <div id="results_list" style="max-height:280px;overflow-y:auto"></div>
                </div>

                <div style="display:flex;gap:10px">
                    <label class="field" style="flex:1">
                        <span>类型</span>
                        <select id="media_type">
                            <option value="movie">电影</option>
                            <option value="series">剧集</option>
                            <option value="episode">单集</option>
                        </select>
                    </label>
                    <label class="field" style="width:96px" id="season_wrap">
                        <span>季数</span>
                        <input type="number" id="season" min="0" value="0">
                    </label>
                    <label class="field" style="width:110px">
                        <span>年份</span>
                        <input type="text" id="year" placeholder="2024">
                    </label>
                </div>

                <label class="field">
                    <span>备注（可不填）</span>
                    <input type="text" id="note" placeholder="例如：要 4K 版本">
                </label>

                <label class="field" id="passcode_wrap" style="display:none">
                    <span>提交口令</span>
                    <input type="password" id="passcode" autocomplete="new-password">
                </label>

                <button id="submit" class="btn-primary btn-block">提交求片</button>
                <div style="margin-top:10px;text-align:center">
                    <a href="#" id="btn_logout" class="faint" style="font-size:12px">退出登录</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <h2 class="card-title">我提交过的</h2>
                <button id="btn_mine" class="btn-sm">查询</button>
            </div>
            <div id="mine"><div class="empty">填入用户名后点击查询</div></div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

function msg(cls, text) {
    $('msg').innerHTML = text ? `<div class="alert ${cls}">${text}</div>` : '';
}

/* ---- 门户鉴权闸门 ---- */
let AUTH_MODE = 'fn';
let CURRENT_USER = '';

async function apiPost(url, body) {
    const r = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin',
        body: JSON.stringify(body || {})
    });
    return r.json();
}

function showGate() {
    $('login_gate').style.display = 'block';
    $('main_form').style.display = 'none';
}

function showForm(username) {
    CURRENT_USER = username || '';
    $('login_gate').style.display = 'none';
    $('main_form').style.display = 'block';
    const who = $('who');
    if (CURRENT_USER) {
        who.style.display = 'block';
        who.innerHTML = `已登录：<b>${CURRENT_USER}</b>`;
    } else {
        who.style.display = 'none';
    }
    // 非 fn 档位仍需自报用户名
    $('requester_wrap').style.display = AUTH_MODE === 'fn' ? 'none' : 'block';
    buildSearchBox();
}

async function doPortalLogin() {
    const u = $('p_username').value.trim();
    const p = $('p_password').value;
    if (!u || !p) return msg('alert-err', '请输入飞牛影视账号和密码');
    $('btn_login').disabled = true;
    try {
        const b = await apiPost('/api/requests/portal_login', {username: u, password: p});
        if (b.status === 'success') {
            $('p_password').value = '';
            msg('', '');
            showForm(b.data.username);
            loadMine();
        } else {
            msg('alert-err', b.message || '登录失败');
        }
    } catch (e) {
        msg('alert-err', '登录请求失败：' + e.message);
    } finally {
        $('btn_login').disabled = false;
    }
}

$('btn_login').onclick = doPortalLogin;
$('p_password').addEventListener('keydown', e => { if (e.key === 'Enter') doPortalLogin(); });

$('btn_logout').onclick = async (e) => {
    e.preventDefault();
    try { await apiPost('/api/requests/portal_logout'); } catch (_) { /* 忽略 */ }
    CURRENT_USER = '';
    $('mine').innerHTML = '<div class="empty">登录后可见</div>';
    showGate();
};

// 读取门户配置：鉴权档位 / 是否开放 / 是否需要口令 / 搜索源
fetch('/api/requests/config', {credentials: 'same-origin'})
    .then(r => r.json())
    .then(async b => {
        const d = b.data || {};
        AUTH_MODE = d.auth_mode || 'fn';
        if (d.search_source) SEARCH_SOURCE = d.search_source;
        if (!d.enabled) {
            msg('alert-warn', '求片通道当前已关闭，请联系管理员。');
            return;
        }
        if (d.need_passcode) $('passcode_wrap').style.display = 'block';

        if (AUTH_MODE === 'fn') {
            if (d.logged_in) {
                const me = await (await fetch('/api/requests/me',
                                              {credentials: 'same-origin'})).json();
                showForm((me.data || {}).username || '');
                loadMine();
            } else {
                showGate();
            }
        } else {
            showForm('');
            loadMine();
        }
    })
    .catch(() => {});

$('media_type').onchange = () => {
    $('season_wrap').style.display = $('media_type').value === 'movie' ? 'none' : 'block';
};
$('media_type').dispatchEvent(new Event('change'));

/* ---- 选片搜索：豆瓣（默认，无需 Key）/ TMDB，由后台 search_source 决定 ---- */
let selected = null;
let SEARCH_SOURCE = 'douban';

function buildSearchBox() {
    const label = SEARCH_SOURCE === 'tmdb'
        ? '搜索 TMDB，从海报墙选片'
        : '搜索豆瓣，从海报墙选片';
    $('search_box').innerHTML = `
        <label class="field" style="display:flex;gap:8px">
            <input type="text" id="search_q" placeholder="${label}"
                   style="flex:1" autocomplete="off">
            <button id="btn_search" class="btn-primary btn-sm">搜索</button>
        </label>`;
    $('btn_search').onclick = doSearch;
    $('search_q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
}

async function doSearch() {
    const q = $('search_q').value.trim();
    if (!q) return;
    try {
        const r = await fetch('/api/requests/search?query=' + encodeURIComponent(q),
                              {credentials: 'same-origin'});
        const b = await r.json();
        const rows = b.data || [];
        if (b.message) msg('alert-warn', b.message);
        if (!rows.length) {
            $('search_results').style.display = 'none';
            if (!b.message) msg('alert-warn', '没有匹配结果，可直接手填片名。');
            return;
        }
        $('results_list').innerHTML = rows.map(m => `
            <div class="pick-row" data-p='${JSON.stringify(m).replace(/'/g, "&#39;")}'>
                ${m.poster_url
                    ? `<img class="pick-poster" src="${m.poster_url}" alt="">`
                    : `<div class="pick-poster"></div>`}
                <div class="pick-body">
                    <div class="pick-title">${m.title}
                        <span class="pick-year">${m.year || ''}</span>
                        ${m.rating ? `<span class="badge badge-info">${m.rating}</span>` : ''}
                    </div>
                    <div class="pick-desc">${m.overview || ''}</div>
                </div>
            </div>`).join('');
        $('search_results').style.display = 'block';
        $('results_list').querySelectorAll('.tmdb-row').forEach(el => {
            el.onclick = () => pick(el);
        });
    } catch (e) {
        msg('alert-err', '搜索失败：' + e.message);
    }
}

function pick(el) {
    selected = JSON.parse(el.dataset.p);
    $('results_list').querySelectorAll('.pick-row').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    $('title').value = selected.title;
    $('year').value = selected.year || '';
    $('media_type').value = selected.media_type;
    $('media_type').dispatchEvent(new Event('change'));
}

$('submit').onclick = async () => {
    // fn 档位由后台从会话取提交人，这里的值只是兜底提示
    const requester = AUTH_MODE === 'fn' ? CURRENT_USER : $('requester').value.trim();
    const title = $('title').value.trim();
    if (AUTH_MODE !== 'fn' && !requester) return msg('alert-err', '请填写你的飞牛用户名');
    if (!title) return msg('alert-err', '请填写想看的片名');

    try {
        const r = await fetch('/api/requests/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify({
                title, requester,
                media_type: $('media_type').value,
                season: parseInt($('season').value, 10) || 0,
                year: $('year').value.trim(),
                note: $('note').value.trim(),
                passcode: $('passcode').value,
                external_source: selected ? (selected.external_source || '') : '',
                external_id: selected ? (selected.external_id || null) : null,
                poster_url: selected ? (selected.poster_url || '') : '',
                overview: selected ? (selected.overview || '') : ''
            })
        });
        const b = await r.json();
        if (b.status === 'success') {
            msg('alert-ok', `已提交「${title}」，管理员会尽快处理。`);
            selected = null;
            $('title').value = ''; $('note').value = ''; $('year').value = '';
            loadMine();
        } else {
            msg('alert-err', b.message || '提交失败');
        }
    } catch (e) {
        msg('alert-err', '请求失败：' + e.message);
    }
};

async function loadMine() {
    const requester = AUTH_MODE === 'fn' ? CURRENT_USER : $('requester').value.trim();
    if (!requester) {
        $('mine').innerHTML = AUTH_MODE === 'fn'
            ? '<div class="empty">登录后可见</div>'
            : '<div class="empty">填入用户名后点击查询</div>';
        return;
    }
    try {
        const r = await fetch('/api/requests/mine?requester=' + encodeURIComponent(requester),
                              {credentials: 'same-origin'});
        const b = await r.json();
        const rows = b.data || [];
        if (!rows.length) {
            $('mine').innerHTML = '<div class="empty">暂无记录</div>';
            return;
        }
        $('mine').innerHTML = rows.map(x => `
            <div class="list-row">
                <div class="list-row-head">
                    <b>${x.title}${x.season ? ' 第' + x.season + '季' : ''}</b>
                    <span class="badge ${x.status_badge}">${x.status_text}</span>
                </div>
                <div class="list-meta">
                    ${x.created_at}${x.admin_note ? ' · 管理员：' + x.admin_note : ''}
                </div>
            </div>`).join('');
    } catch (e) {
        $('mine').innerHTML = '<div class="empty">查询失败</div>';
    }
}

$('btn_mine').onclick = loadMine;
</script>
</body>
</html>
